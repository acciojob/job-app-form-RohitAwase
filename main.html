<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="email" required>
        <br>
            <div>
				Gender:
            <input type="radio" id="gender_m" name="gender" value="male" required>
            <label for="gender_m">Male</label>
            <input type="radio" id="gender_f" name="gender" value="female" required>
            <label for="gender_f">Female</label>
			</div>
        <br>
        <label for="laptop">Laptop Brands:</label>
        <select id="laptop" name="laptop">
            <option value="apple">Apple</option>
            <option value="asus">Asus</option>
            <option value="hp">HP</option>
        </select>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Age" required>
        <br>
        <label for="dob">DOB:</label>
        <input type="date" id="dob" name="dob" required >
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password" required>
        <br>
        <label for="portfolio" >Portfolio URL:</label>
        <input type="url" id="portfolio" name="portfolio" required>
        <br>
        <button type="submit" name="action" value="accept">Submit</button>
    </form>
	<script type="text/javascript" src="./script.js">
</script>
</body>
</html>
