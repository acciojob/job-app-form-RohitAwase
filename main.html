<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
    <form method="post">
        <h2>Job Application Form</h2>

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="name" required>

        <br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email" required>

        <br>

        <div>
            <p>Gender</p>
            <input type="radio" id="gender_m" name="gender" required>
            <label for="gender_m">Male</label><br>
            <input type="radio" id="gender_f" name="gender" required>
            <label for="gender_f">Female</label><br>
        </div>

        <br>

        <label for="laptop">Laptop Brands:</label>
        <select id="laptop" name="laptopbrand">
            <option value="apple">Apple</option>
            <option value="asus">Asus</option>
            <option value="hp">HP</option>
        </select>

        <br>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Age" required>

        <br>

        <label for="dob">DOB</label>
        <input type="date" id="dob" required>

        <br>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="password" required>

        <br>

        <label for="portfolio" >Portfolio URL</label>
        <input type="url" id="portfolio">

        <br>

        <button type="submit" name="action" value="accept">Submit</button>

    </form>
	<script type="text/javascript" src="./script.js">
</script>

</body>

</html>
